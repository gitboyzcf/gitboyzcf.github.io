<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="420" fill="#f8fafc"/>
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">虚拟环境：给每个项目一个独立"房间"</text>
  
  <!-- Big computer -->
  <rect x="120" y="70" width="560" height="310" rx="16" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="3"/>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4338ca">你的电脑（Anaconda 管理）</text>
  
  <!-- Room 1 -->
  <rect x="150" y="130" width="150" height="220" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="225" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">环境 A</text>
  <text x="225" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">Python 3.10</text>
  <text x="225" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">LangChain 0.3</text>
  <text x="225" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">项目老代码</text>
  
  <!-- Room 2 -->
  <rect x="325" y="130" width="150" height="220" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">环境 B</text>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">Python 3.13</text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">LangChain 1.2</text>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#166534">本课程学习</text>
  
  <!-- Room 3 -->
  <rect x="500" y="130" width="150" height="220" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="575" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9d174d">环境 C</text>
  <text x="575" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9d174d">Python 3.11</text>
  <text x="575" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9d174d">其他项目</text>
  <text x="575" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9d174d">互不影响</text>
  
  <!-- System Python outside -->
  <rect x="300" y="355" width="200" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">系统 Python（不建议直接用）</text>
  
  <!-- Isolation arrows -->
  <line x1="300" y1="180" x2="325" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="475" y1="180" x2="500" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b" font-style="italic">每个环境独立，互不干扰</text>
</svg>
