<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="rag1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="400" fill="#f8fafc"/>
  
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">RAG 检索增强生成流程</text>
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">让大模型先查资料，再回答问题，告别胡说八道</text>
  
  <!-- Step 1: User Question -->
  <circle cx="100" cy="200" r="45" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">用户</text>
  <text x="100" y="212" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">提问</text>
  
  <!-- Arrow 1 -->
  <line x1="150" y1="200" x2="190" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ragArrow)"/>
  
  <!-- Step 2: Document Loading -->
  <rect x="200" y="150" width="110" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">加载文档</text>
  <text x="255" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">PDF/Word/TXT</text>
  <text x="255" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">Excel/数据库</text>
  <text x="255" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">各种数据源</text>
  
  <!-- Arrow 2 -->
  <line x1="315" y1="200" x2="350" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ragArrow)"/>
  
  <!-- Step 3: Split -->
  <rect x="355" y="150" width="100" height="100" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="405" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#5b21b6">文本切分</text>
  <text x="405" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b21b6">长文档 →</text>
  <text x="405" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b21b6">小块 Chunk</text>
  <text x="405" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b21b6">便于检索</text>
  
  <!-- Arrow 3 -->
  <line x1="460" y1="200" x2="495" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ragArrow)"/>
  
  <!-- Step 4: Vector DB -->
  <rect x="500" y="150" width="110" height="100" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="555" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9d174d">向量数据库</text>
  <text x="555" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9d174d">文本 → 向量</text>
  <text x="555" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9d174d">存储 + 索引</text>
  <text x="555" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9d174d">语义检索</text>
  
  <!-- Arrow 4: Query goes to vector DB -->
  <path d="M 405 250 L 405 280 L 555 280 L 555 250" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#ragArrow)"/>
  <text x="480" y="298" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">用户问题也转成向量，查找最相似的片段</text>
  
  <!-- Arrow 5 -->
  <line x1="615" y1="200" x2="650" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ragArrow)"/>
  
  <!-- Step 5: LLM -->
  <rect x="655" y="150" width="110" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="710" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">大模型</text>
  <text x="710" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">结合问题 + </text>
  <text x="710" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">检索到的上下文</text>
  <text x="710" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">生成答案</text>
  
  <!-- Arrow 6 -->
  <line x1="770" y1="200" x2="805" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#ragArrow)"/>
  
  <!-- Step 6: Answer -->
  <circle cx="855" cy="200" r="45" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="855" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">生成</text>
  <text x="855" y="212" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#064e3b">答案</text>
  
  <defs>
    <marker id="ragArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
